<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-label="NatyaVault">
  <!-- The same mark the app draws everywhere: a red-800 tile holding the gold
       Om (ॐ) — see the Om component and BrandMark in src/. The home-screen
       PNGs in public/icons are rendered from this artwork. -->
  <defs>
    <radialGradient id="sheen" cx="30%" cy="22%" r="85%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.10" />
      <stop offset="60%" stop-color="#ffffff" stop-opacity="0" />
    </radialGradient>
  </defs>
  <rect width="512" height="512" rx="113" fill="#991b1b" />
  <rect width="512" height="512" rx="113" fill="url(#sheen)" />
  <text
    x="256"
    y="334.5"
    font-size="379.9"
    font-weight="500"
    fill="#fde047"
    text-anchor="middle"
    dominant-baseline="central"
  >&#x0950;</text>
</svg>
